<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MineLoop Pod Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; a machine-HMI style overlay (top bar, status pill, zone rail, side card / bottom sheet) that also works as the AR DOM overlay.
   Single deliberate look: dark control-panel UI, LED green accent, amber for running, red for reject / closed. */
:root {
  color-scheme: dark;
  --stage-1: #3b4751;
  --stage-2: #161b20;
  --panel: rgba(18, 23, 27, 0.93);
  --panel-solid: #161c20;
  --well: #0f1417;
  --line: #2f3b43;
  --line-strong: #44535d;
  --fg: #e8ede9;
  --text: #d3dbd6;
  --muted: #98a6a0;
  --faint: #6c7a74;
  --accent: #3fe08c;
  --accent-deep: #1d7656;
  --accent-wash: #12342a;
  --amber: #f2b33d;
  --red: #ff5a4a;
  --red-wash: #4a2420;
  --slurry: #c98a4b;
  --water: #4aa3ec;
  --water-b: #9fd3ff;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--fg); font-family: var(--body); font-size: 14px;
  background: radial-gradient(120% 90% at 50% 30%, var(--stage-1), var(--stage-2));
}
body.ar { background: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#ui { position: fixed; inset: 0; pointer-events: none; font-family: var(--body); }
#ui .hit { pointer-events: auto; }

/* top bar */
.top {
  position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.brand b { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; line-height: 1; }
.brand span { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent-deep); border-color: var(--accent); }
.btn.primary:hover { background: #22895f; }
.btn.danger { background: var(--red-wash); border-color: var(--red); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.btn.sm { min-height: 32px; padding: 7px 10px; font-size: 12px; }

/* status pill */
.status {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(56px + env(safe-area-inset-top, 0px));
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; max-width: min(560px, calc(100% - 440px));
}
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--text); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.pill.ok::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.pill.bad::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
.pill b { font-family: var(--mono); font-weight: 500; letter-spacing: 0; color: var(--fg); }

/* zone rail */
.rail {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: baseline; gap: 6px; cursor: pointer; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px;
  font: 500 13px/1 var(--display); letter-spacing: .04em;
}
.chip i { font-style: normal; font-weight: 700; color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }

/* info card */
.card {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  width: 384px; max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(6px);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.tag { font: 700 12px/1 var(--display); letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
.card h2 { margin: 5px 0 0; font: 700 26px/1.05 var(--display); letter-spacing: .01em; text-wrap: balance; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; }
.x:hover { color: var(--fg); }
.x svg { width: 18px; height: 18px; display: block; }
.card-body { overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.card-body p { margin: 0; line-height: 1.5; color: var(--text); }
.specs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.specs li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; color: #cfd7d2; display: flex; gap: 8px; }
.specs li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 1px; background: var(--accent-deep); }
.next { display: flex; flex-direction: column; gap: 6px; }
.next h3, .panel h3 { margin: 0; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.soon { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 8px 10px; line-height: 1.4; }
.soon b { color: var(--amber); font-weight: 600; }

/* control panels */
.panel { display: flex; flex-direction: column; gap: 10px; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px; }
.panel-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.led { display: inline-flex; align-items: center; gap: 7px; font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.led::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #34403b; box-shadow: inset 0 0 0 1px #4b5853; }
.led[data-s="run"] { color: var(--amber); } .led[data-s="run"]::before { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.led[data-s="pass"], .led[data-s="ok"] { color: var(--accent); } .led[data-s="pass"]::before, .led[data-s="ok"]::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.led[data-s="fail"] { color: var(--red); } .led[data-s="fail"]::before { background: var(--red); box-shadow: 0 0 10px var(--red); }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps span { font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; text-align: center; color: var(--faint); padding: 6px 2px; border-radius: 4px; background: #1d252a; }
.steps span.on { color: #1a1300; background: var(--amber); }
.steps span.done { color: var(--accent); background: var(--accent-wash); }
.graph { width: 100%; height: 120px; display: block; background: var(--well); border-radius: 6px; border: 1px solid var(--line); }
.reads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.reads.two { grid-template-columns: repeat(2, 1fr); }
.read { background: var(--well); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; }
.read small { display: block; font: 600 10.5px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.read b { display: block; margin-top: 5px; font: 500 16px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.read b em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 2px; }
.read.big b { font-size: 24px; }
.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: #cfd7d2; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle span { width: 32px; height: 18px; border-radius: 999px; background: #2a343a; border: 1px solid var(--line-strong); position: relative; flex: none; }
.toggle span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle input:checked + span { background: var(--red-wash); border-color: var(--red); }
.toggle input:checked + span::after { transform: translateX(14px); background: var(--red); }
.toggle.go input:checked + span { background: var(--accent-wash); border-color: var(--accent); }
.toggle.go input:checked + span::after { background: var(--accent); }
.log { list-style: none; margin: 0; padding: 0; font: 400 12px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.log li { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); color: #c3ccc7; }
.log li b { font-weight: 500; }
.ok { color: var(--accent); } .bad { color: var(--red); } .warn { color: var(--amber); }
.log li.empty { display: block; color: var(--faint); font-family: var(--body); }
.events { list-style: none; margin: 0; padding: 0; font-size: 12px; line-height: 1.35; max-height: 120px; overflow-y: auto; }
.events li { display: grid; grid-template-columns: 4.2em 1fr; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); color: #c3ccc7; }
.events li time { font-family: var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.events li.empty { display: block; color: var(--faint); }
.tally { display: flex; gap: 14px; flex-wrap: wrap; font: 500 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tally b { font-family: var(--mono); color: var(--fg); letter-spacing: 0; margin-left: 4px; }
.note { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
.note b { color: var(--amber); font-weight: 500; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: #cfd7d2; }
.field input[type=number] { width: 7.5em; background: var(--well); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--fg); font: 500 14px var(--mono); padding: 6px 8px; text-align: right; }
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: #cfd7d2; }
.slider .row b { font: 500 14px var(--mono); color: var(--fg); }
.slider input[type=range] { width: 100%; accent-color: var(--accent); }
.scale { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--red-wash) 0 var(--lo), var(--accent-wash) var(--lo) var(--hi), #3a2f18 var(--hi) 100%); }
.scale-labels { display: flex; justify-content: space-between; font: 600 10.5px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg button { font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--text); background: var(--well); border: 1px solid var(--line); border-radius: 6px; padding: 8px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.seg button small { font: 500 11px/1 var(--mono); letter-spacing: 0; color: var(--muted); text-transform: none; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.gauge { position: relative; height: 14px; border-radius: 4px; background: #1d252a; overflow: hidden; }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6b5a46, #a08b70); }
.gauge u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--accent); }
.gauge-labels { display: flex; justify-content: space-between; font: 500 11px/1 var(--mono); color: var(--faint); }
.chipline { display: flex; gap: 6px; flex-wrap: wrap; }
.state { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 4px; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; background: #1d252a; color: var(--muted); }
.state.ok { background: var(--accent-wash); color: var(--accent); }
.state.warn { background: #3a2f18; color: var(--amber); }
.state.bad { background: var(--red-wash); color: var(--red); }
.route { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.route div { border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; background: var(--well); }
.route div.on { border-color: var(--accent); }
.route small { display: block; font: 600 10.5px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.route b { display: block; margin-top: 4px; font: 500 14px/1 var(--mono); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* hints + AR controls */
.hint {
  z-index: 5; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(320px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px 16px; text-align: center; line-height: 1.45;
}
.hint b { display: block; font: 700 18px/1.1 var(--display); letter-spacing: .04em; margin-bottom: 4px; }
.hint.toast { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 14px; font-size: 13px; }
.arbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
.arbar .btn { padding: 8px 10px; min-height: 36px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: 600 14px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

body:not(.ar) .ar-only { display: none !important; }
body.ar .desk-only { display: none !important; }

/* tour bar (lower third) */
.tourbar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(780px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line-strong); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 12px 14px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; overflow: hidden;
}
.tourbar .tag { grid-column: 1; }
.tourbar h3 { grid-column: 1; margin: 0; font: 700 24px/1.05 var(--display); text-wrap: balance; }
.tourbar p { grid-column: 1 / -1; margin: 0; color: var(--text); line-height: 1.45; font-size: 13.5px; }
.tb-ctrl { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
.tb-ctrl .btn { min-height: 36px; padding: 8px 10px; }
.tb-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #1d252a; }
.tb-prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.tb-dots { grid-column: 1 / -1; display: flex; gap: 4px; }
.tb-dots span { flex: 1; height: 3px; border-radius: 2px; background: #2a343a; }
.tb-dots span.on { background: var(--accent); } .tb-dots span.done { background: var(--accent-deep); }
body.tour .rail, body.tour .card { display: none !important; }
/* sheets: setpoints + faults */
.group { display: flex; flex-direction: column; gap: 8px; }
.group h3 { margin: 0; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.group .field { border-top: 1px solid var(--line); padding-top: 8px; }
.group .field small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.fault { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel-solid); }
.fault.on { border-color: var(--red); }
.fault-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.fault-top b { font: 700 17px/1.1 var(--display); letter-spacing: .02em; }
.fault p { font-size: 12.5px; }
.mixbar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.mixbar i { display: block; height: 100%; }
.mixbar .k { background: #6b5a46; } .mixbar .d { background: #bdb6a6; } .mixbar .c { background: #7d8486; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

@media (max-width: 1000px) { .status { top: auto; left: 50%; transform: translateX(-50%); justify-content: center; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); } body.card-open .status, body.tour .status { display: none; } }
@media (max-width: 720px) {
  .brand b { font-size: 19px; }
  .brand span { display: none; }
  .btn .lbl { display: none; }
  .actions { gap: 5px; }
  .actions > .btn { padding: 8px 8px; min-height: 36px; }
  .tourbar h3 { font-size: 20px; } .tourbar p { font-size: 12.5px; }
  .card { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; top: auto; max-height: 58%; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .card h2 { font-size: 22px; }
  .arbar { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  body.ar.card-open .arbar { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toggle span::after { transition: none; } }
</style></head><body>

<div id="stage"></div>

<div id="ui">
  <div id="loading">Loading pod model…</div>

  <header class="top">
    <div class="brand"><b>MINELOOP</b><span>Interactive pod · concept model, not to scale</span></div>
    <div class="actions hit">
      <button class="btn" id="btnTour" type="button" title="Guided tour of the whole process">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg><span class="lbl">Tour</span></button>
      <button class="btn" id="btnSet" type="button" title="Edit the pod's limits and targets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Setpoints</span></button>
      <button class="btn" id="btnFault" type="button" title="Inject faults and watch the pod react">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h0"/></svg><span class="lbl">Faults</span></button>
      <button class="btn primary desk-only" id="btnAR" type="button" title="Place the pod on a real table">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg><span class="lbl">View in AR</span></button>

  const dz = PR.headRest - head;

  blocks.children.forEach((b) => {

const SCREENS = [];
function screenPlane(at, w, h, px, draw, rotY = 0) {
  const c = document.createElement('canvas'); c.width = px; c.height = Math.round(px * h / w);

}
function setupScreens() {

function screenBase(g, W, H, title) {
  g.fillStyle = '#0b1210'; g.fillRect(0, 0, W, H);

  g.fillStyle = '#e8ede9'; g.font = `700 ${H * 0.11}px "Barlow Condensed", sans-serif`; g.textBaseline = 'middle'; g.fillText(title, W * 0.04, H * 0.08);
}
function drawCtrl(g, W, H) {

  const rows = [

}
function drawHMI(g, W, H) {

/* ---------- picking ---------- */
const ray = new THREE.Raycaster();
function zoneFromHit(hit) {
  let o = hit.object;
  if (o.userData.bag != null) return { id: 'Z2', bag: o.userData.bag };
  if (o.name === 'Sludge_tank' || o.name === 'Tank_lid') return { id: 'Z1', tank: true };
  if (o.userData.zoneId) return { id: o.userData.zoneId };
  while (o) {
    if (o.userData.zoneId) return { id: o.userData.zoneId };
    if (o.name === 'ZONE_Context') {
      const p = site.worldToLocal(hit.point.clone());
      if (ZONES.pit.box.containsPoint(new THREE.Vector3(p.x, 0.1, p.z))) return { id: 'pit' };
      if (ZONES.plant.box.containsPoint(new THREE.Vector3(p.x, 0.1, p.z))) return { id: 'plant' };
      return null;
    }
    o = o.parent;
  }
  return null;
}
function pickWithRay() {
  if (!site) return;
  const targets = labels.visible ? [...labels.children, ...pickables] : pickables;
  const hits = ray.intersectObjects(targets, false).filter((h) => h.object.visible && !(h.object.material && h.object.material.transparent && h.object.material.opacity < 0.5 && h.object.userData.bag == null));
  const z = hits.length ? zoneFromHit(hits[0]) : null;
  if (!z) return select(null);
  if (z.id === selected && (z.bag != null || z.tank)) {   // same zone: just open the bag / tank without moving the camera
    if (z.bag != null) S.openBag = z.bag; if (z.tank) S.tankOpen = true;
    if (z.tank) { const o = $('#tankOpen'); if (o) o.checked = true; }
    renderPanel(); return;
  }
  if (z.id === selected) return;
  select(z.id, z);
}
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || renderer.xr.isPresenting) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 6 || dt > 500) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  pickWithRay();
});

const reticle = new THREE.Group(); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
{
  reticle.add(new THREE.Mesh(new THREE.RingGeometry(0.045, 0.06, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x3fe08c })));
  const fp = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2)), new THREE.LineBasicMaterial({ color: 0x3fe08c, transparent: true, opacity: 0.8 }));
  fp.name = 'footprint'; reticle.add(fp);
}
let arScale = 1 / 60, arYaw = 0, placed = false, hitSource = null, xrSession = null;
const FOOT = { w: 28.5, d: 32 };
function setFootprint() { const fp = reticle.getObjectByName('footprint'); fp.scale.set(FOOT.w * arScale, 1, FOOT.d * arScale); fp.rotation.y = arYaw; }
async function arSupported() { try { return !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch { return false; } }
function showHint(html, toast = false, ms = 0) {
  const h = $('#hint'); h.innerHTML = html; h.classList.toggle('toast', toast); h.hidden = false;
  clearTimeout(showHint._t); if (ms) showHint._t = setTimeout(() => { h.hidden = true; }, ms);
}
$('#btnAR').onclick = async () => {
  if (!(await arSupported())) {
    showHint('<b>AR is not available here</b>Open the hosted link on an Android phone in Chrome. Here, use the 3D view: drag to orbit, pinch or scroll to zoom, tap a zone.', false, 7000);
    return;
  }

    xrSession = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('#ui') } });

  await renderer.xr.setSession(xrSession);
  const viewer = await xrSession.requestReferenceSpace('viewer');
  hitSource = await xrSession.requestHitTestSource({ space: viewer });

  labelScale = 1.6; setFootprint(); camera.clearViewOffset();

};
$('#btnExitAR').onclick = () => xrSession && xrSession.end();
function onAREnd() {

  document.body.classList.remove('ar'); reticle.visible = false; $('#hint').hidden = true;
  world.visible = true; world.position.set(0, 0, 0); world.rotation.set(0, 0, 0); world.scale.setScalar(1); shadowCatcher.visible = false;

for (const el of document.querySelectorAll('#ui .hit')) el.addEventListener('beforexrselect', (e) => e.preventDefault());
const controller = renderer.xr.getController(0); scene.add(controller);
controller.addEventListener('select', () => {

$('#arSmaller').onclick = () => { arScale = Math.max(1 / 160, arScale / 1.25); world.scale.setScalar(arScale); setFootprint(); };
$('#arBigger').onclick = () => { arScale = Math.min(1 / 6, arScale * 1.25); world.scale.setScalar(arScale); setFootprint(); };

$('#arMove').onclick = () => { placed = false; world.visible = false; $('#arbar').hidden = true; showHint('<b>Move the pod</b>Point at a new spot and tap.', false); };

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const DT_MAX = TEST ? 2 : 0.1;
if (TEST) window.__ml = { S, P, SET, MIXD, updatePress, startPress, startBatch, startGrading, mixTank, select, openSheet, startTour, tourGo, T, step: null, freeze: false };
function simStep(dt) {
  updateBatch(dt); tickDrying(dt); updateGrader(dt); updateMixer(dt); updatePress(dt);
  for (const f of Object.values(FLOWS)) f.update(dt);
  updateBags(dt); updateTank(dt);
}
if (TEST) window.__ml.step = (sec, h = 0.05) => { for (let x = 0; x < sec; x += h) simStep(h); };
let uiT = 0, camLocalPos = null;
const perf = { acc: 0, n: 0 };

  if (TEST || renderer.xr.isPresenting) return;

  if (perf.acc < 2) return;
  const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0;
  let next = pixelRatio;
  if (avg > 1 / 28 && pixelRatio > 0.75) next = pixelRatio - 0.25;
  else if (avg < 1 / 50 && pixelRatio < PR_MAX) next = Math.min(PR_MAX, pixelRatio + 0.25);
  if (next !== pixelRatio) { pixelRatio = next; renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight); }

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), DT_MAX), sdt = TEST && window.__ml.freeze ? 0 : dt;   // sdt drives the simulation
  if (frame && hitSource && !placed) {
    const res = frame.getHitTestResults(hitSource);
    if (res.length) {

    } else reticle.visible = false;
  }
  if (fly) {
    fly.t += dt / fly.dur; const k = ease(Math.min(1, fly.t));
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (fly.t >= 1) fly = null;
  }
  for (const r of Object.values(roofParts)) {
    const cur = r.mesh.userData.k || 0, k = cur + (r.lift - cur) * Math.min(1, dt * 6);
    r.mesh.userData.k = k; r.mesh.position.y = r.y0 + k * 2.6; r.mesh.material.opacity = 1 - k * 0.75; r.mesh.material.depthWrite = k < 0.5;
  }

    if (labels.visible) {
      for (const sp of labels.children) { const k = Math.min(1, Math.max(0.16, camLocal.distanceTo(sp.position) / 30)); const h = 1.0 * labelScale * k; sp.scale.set(h * sp.userData.aspect, h, 1); }
    }
    uiT -= dt;
    updateTour(sdt);
    if (uiT <= 0) {
      uiT = 0.1; updateStatus();
      if (sheet) SHEETS[sheet].tick && SHEETS[sheet].tick();
      else if (selected && ZONES[selected].panel && !$('#card').hidden) PANELS[ZONES[selected].panel].tick();
    }

});
addEventListener('resize', () => {

addEventListener('load', () => { const h = location.hash.slice(1); if (ZONES[h]) { const w = setInterval(() => { if (site) { clearInterval(w); select(h); } }, 100); } });
